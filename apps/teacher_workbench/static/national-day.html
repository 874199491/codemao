<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>国庆补课计划 · 教师工作台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="schedule-page monthly-exam-page national-day-page">
  <main class="monthly-exam-shell">
    <header class="monthly-exam-commandbar">
      <a class="back-link monthly-back-link" href="/">← 返回教师工作台</a>
      <div class="monthly-exam-title">
        <span>国庆补课</span>
        <h1>补课计划图片与群发队列</h1>
        <p>先从 CRM 更新最新完课，筛出偶数未完课学员，再勾选生成图片和创建企微待发送任务。</p>
      </div>
      <div class="monthly-exam-hero-card">
        <span>当前清单</span>
        <strong id="ndHeroReady">--</strong>
        <small id="ndHeroMeta">尚未读取</small>
      </div>
    </header>

    <section class="monthly-flow-strip" aria-label="国庆补课计划流程">
      <div><b>刷新 CRM</b><span>读取最新完课</span></div>
      <div><b>勾选出图</b><span>按学员生成 PNG</span></div>
      <div><b>创建任务</b><span>企微待发送，人工确认</span></div>
    </section>

    <section class="monthly-exam-preview panel">
      <div class="panel-heading">
        <div>
          <h2>未完课学员清单</h2>
          <p>点击刷新清单会先从 CRM 更新最新完课，再按 10.1～10.7 分配补课。</p>
        </div>
        <div class="monthly-heading-actions">
          <button id="ndPreview" class="button secondary" type="button">刷新清单</button>
          <button id="ndGenerateVisible" class="button primary" type="button">生成当前选择</button>
        </div>
      </div>
      <div id="ndStats" class="monthly-stats"></div>
      <div class="monthly-toolbar">
        <label class="monthly-search"><span>筛选</span><input id="ndSearch" type="search" placeholder="姓名或学生 ID"></label>
        <select id="ndStatusFilter" aria-label="按状态筛选">
          <option value="">全部状态</option>
          <option value="image">已生成图片</option>
          <option value="pending">未生成图片</option>
          <option value="sent">已创建待发送</option>
        </select>
        <div class="nd-multiselect" id="ndLessonCountFilter">
          <button id="ndLessonCountToggle" class="nd-multiselect-toggle" type="button" aria-expanded="false" aria-haspopup="true">
            <span id="ndLessonCountLabel">未完课节数</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="nd-multiselect-menu" id="ndLessonCountMenu" hidden>
            <label><input type="checkbox" name="ndLessonCount" value="1"><span>1 节未完</span></label>
            <label><input type="checkbox" name="ndLessonCount" value="2"><span>2 节未完</span></label>
            <label><input type="checkbox" name="ndLessonCount" value="3"><span>3 节未完</span></label>
            <label><input type="checkbox" name="ndLessonCount" value="4"><span>4 节未完</span></label>
            <label><input type="checkbox" name="ndLessonCount" value="5+"><span>5 节及以上</span></label>
          </div>
        </div>
        <button id="ndSelectVisible" class="text-button" type="button">选择当前结果</button>
        <button id="ndClearSelection" class="text-button" type="button">清空选择</button>
      </div>
      <div class="monthly-table-wrap">
        <table class="monthly-table">
          <thead><tr><th class="check-col"><input id="ndSelectAll" type="checkbox" aria-label="选择当前结果"></th><th>学员</th><th>未完课</th><th>10.1～10.7 安排</th><th>状态</th></tr></thead>
          <tbody id="ndRows"></tbody>
        </table>
      </div>
      <div class="monthly-send-bar">
        <div>
          <b id="ndSelectedCount">已选择 0 人</b>
          <small>生成只处理已选学员；群发只处理已生成图片的学员。</small>
        </div>
        <div class="monthly-send-actions">
          <button id="ndSendSelected" class="button primary" type="button" disabled>群发已选计划</button>
        </div>
      </div>
      <div id="ndJobStatus" class="monthly-job-status" hidden></div>
      <p id="ndStatus" class="inline-status" role="status"></p>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="/national-day.js"></script>
</body>
</html>
