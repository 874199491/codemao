<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每周趋势</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="schedule-page trends-page">
  <main class="schedule-shell">
    <section class="schedule-hero trend-hero">
      <div>
        <a class="back-link" href="/">← 返回教师工作台</a>
        <p class="eyebrow">WEEKLY TRENDS</p>
        <h1>每周趋势</h1>
        <p>按本地已更新的周数据展示完课、未到课、到课未完课和直播参与变化。每更新一周，趋势会自动补齐。</p>
      </div>
      <div class="timer-card trend-summary-card">
        <span>当前视图</span>
        <strong id="trendLatestWeek">--</strong>
        <small id="trendCheckedAt">正在读取本地数据</small>
      </div>
    </section>

    <section class="trend-overview">
      <div id="trendStats" class="trend-stats">
        <div class="empty-state">正在读取最近一周…</div>
      </div>
    </section>

    <section class="trend-panel trend-chart-panel">
      <div class="trend-chart-head">
        <div>
          <h2>周趋势图</h2>
          <p id="trendMessage">正在读取数据…</p>
        </div>
        <div class="trend-actions">
          <button id="updateTrendData" class="button primary" type="button">更新趋势数据</button>
          <button id="refreshTrends" class="button secondary" type="button">刷新</button>
        </div>
      </div>
      <p id="trendUpdateStatus" class="trend-update-status"></p>
      <div class="trend-chart-shell">
        <div id="trendLegend" class="trend-legend"></div>
        <div id="trendChart" class="trend-chart" role="img" aria-label="每周趋势图">
          <div class="empty-state">正在生成趋势图…</div>
        </div>
      </div>
    </section>

    <section class="trend-panel trend-table-panel">
      <div class="trend-chart-head">
        <div>
          <h2>周数据明细</h2>
          <p>用于快速核对每周人数和数据来源。</p>
        </div>
      </div>
      <div id="trendTable" class="trend-table-wrap">
        <div class="empty-state">正在加载明细…</div>
      </div>
    </section>

    <dialog id="trendDetailDialog" class="detail-dialog trend-detail-dialog">
      <div class="detail-shell">
        <div class="detail-head">
          <div>
            <span class="eyebrow">STUDENT DETAILS</span>
            <h2 id="trendDetailTitle">学生名单</h2>
            <p id="trendDetailSummary"></p>
          </div>
          <button id="closeTrendDetails" class="icon-button" type="button" aria-label="关闭">×</button>
        </div>
        <div class="detail-tools">
          <div class="detail-filters">
            <input id="trendStudentSearch" type="search" placeholder="搜索姓名或学生 ID">
            <select id="trendClassTimeFilter" aria-label="筛选上课时间">
              <option value="">全部上课时间</option>
            </select>
          </div>
          <div class="detail-tool-actions">
            <button id="copyTrendStudentIds" class="button secondary" type="button">复制当前 ID</button>
          </div>
        </div>
        <div class="student-table-wrap">
          <table>
            <thead>
              <tr>
                <th>学生姓名</th>
                <th>学生 ID</th>
                <th>当前状态</th>
                <th>上课时间</th>
                <th>班级</th>
              </tr>
            </thead>
            <tbody id="trendStudentRows"></tbody>
          </table>
        </div>
      </div>
    </dialog>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="/vendor/echarts.min.js"></script>
  <script src="/trends.js"></script>
</body>
</html>
