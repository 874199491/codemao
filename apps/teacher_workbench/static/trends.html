<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每周趋势</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="schedule-page trends-page">
  <main class="schedule-shell">
    <section class="schedule-hero trend-hero">
      <div>
        <a class="back-link" href="/">← 返回教师工作台</a>
        <p class="eyebrow">WEEKLY TRENDS</p>
        <h1>每周趋势</h1>
        <p>根据本地已更新的周数据生成趋势图。后续每更新一周，图表会自动补齐。</p>
      </div>
      <div class="timer-card trend-summary-card">
        <span>最新状态</span>
        <strong id="trendLatestWeek">--</strong>
        <small id="trendCheckedAt">正在读取本地缓存</small>
      </div>
    </section>

    <section class="trend-layout">
      <article class="trend-panel trend-chart-panel">
        <div class="section-heading">
          <div>
            <h2>完课与风险趋势</h2>
            <p id="trendMessage">正在读取数据…</p>
          </div>
          <button id="refreshTrends" class="button secondary" type="button">刷新</button>
        </div>
        <div id="trendLegend" class="trend-legend"></div>
        <div id="trendChart" class="trend-chart" role="img" aria-label="每周完课与异常趋势图">
          <div class="empty-state">正在生成趋势图…</div>
        </div>
      </article>

      <aside class="trend-panel trend-stat-panel">
        <h2>最近一周</h2>
        <div id="trendStats" class="trend-stats">
          <div class="empty-state">暂无趋势数据</div>
        </div>
      </aside>
    </section>

    <section class="trend-panel">
      <div class="section-heading">
        <div>
          <h2>周数据明细</h2>
          <p>用于快速核对每周人数和数据来源。</p>
        </div>
      </div>
      <div id="trendTable" class="trend-table-wrap">
        <div class="empty-state">正在加载明细…</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="/trends.js"></script>
</body>
</html>
