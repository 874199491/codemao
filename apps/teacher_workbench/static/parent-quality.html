<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>家长质检 · 教师工作台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="schedule-page parent-quality-page">
  <main class="schedule-page main monthly-exam-shell">
    <section class="schedule-hero monthly-exam-hero">
      <div>
        <a class="back-link" href="/">← 返回教师工作台</a>
        <h1>家长质检</h1>
        <p>检测"家长发了最新消息、老师暂未回复"的，便于跟进与质检。</p>
      </div>
      <div class="timer-card monthly-exam-hero-card">
        <span>未回复</span>
        <strong id="pqCount">--</strong>
        <small>尚未检测</small>
      </div>
    </section>

    <section class="monthly-exam-preview panel parent-quality-panel">
      <div class="panel-heading">
        <div><h2>未回复家长</h2><p>家长发了最新消息、老师未回复的，按时间倒序。</p></div>
        <div class="pq-actions">
          <button id="pqRefresh" class="button secondary" type="button">刷新CRM数据</button>
          <button id="pqRun" class="button primary" type="button">快速检测</button>
        </div>
      </div>
      <p id="pqStatus" class="inline-status" role="status">尚未检测。</p>
      <div class="monthly-table-wrap">
        <table class="monthly-table"><thead><tr><th>家长最后发言</th><th>家长最后消息</th><th>老师最后回复</th><th>老师</th><th>家长</th><th>学生ID</th></tr></thead><tbody id="pqRows"></tbody></table>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="/parent-quality.js"></script>
</body>
</html>
